name: Release

# Push a tag like v0.2.0 on a commit that is already on main:
#   git tag v0.2.0 && git push origin v0.2.0
# Result: a GitHub Release with a signed APK and its sha256 checksum.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

# Least privilege by default; only the release job may write.
permissions:
  contents: read

# Never cancel a release halfway; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload files to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need origin/main for the check below

      # Only reviewed code ships: the tagged commit must be on main
      # (main only changes through PRs with green CI).
      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag a merged commit."
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # Secrets hold text, so the keystore is stored base64-encoded.
      # It goes to the runner's temp dir, which is wiped after the job.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # v0.2.0 -> -PappVersion=0.2.0 -> versionName 0.2.0, versionCode 200.
      - name: Test and build signed APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"

      # Fails if the APK is unsigned or the signature is broken; prints the
      # certificate fingerprint, which must stay the same for every release.
      - name: Verify signature and checksum
        run: |
          apk="30-min-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep SHA-256
          sha256sum "$apk" > "$apk.sha256"

      # R8 renames classes; this file turns a release crash stack back into
      # real names. Kept 90 days in the run, not attached to the release.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      # 0.x versions are marked pre-release (testing with friends).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "30-min-$GITHUB_REF_NAME.apk" "30-min-$GITHUB_REF_NAME.apk.sha256" \
            --verify-tag --generate-notes $pre --title "30-Min $GITHUB_REF_NAME"
