name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job token can read the repo, nothing else.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    # On PRs gitleaks lists the PR's commits via the API (403 without this).
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Actions pinned by commit SHA; the comment shows the human version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so old commits get scanned too
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # would need pull-requests: write

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      # Caches ~/.gradle and validates gradle-wrapper.jar checksum by default.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Same SDK packages as .devcontainer/Dockerfile.
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # lintDebug: Android Lint (API levels, manifest, Compose rules); fails on errors.
      # assembleRelease: runs R8 shrinking, which can break code (reflection,
      # generated Room classes) in ways a debug build never shows. Unsigned here.
      - name: Lint, test, build
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: app/build/reports/

  # GitHub cannot read Gradle Kotlin scripts / the version catalog, so without
  # this its dependency graph (and Dependabot alerts) sees no app libraries.
  # Resolves the full tree (incl. transitive) and uploads it. main only.
  dependency-graph:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # required by the dependency submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
