<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="t">
  <title id="t">30-Min: the first 30 minutes are yours. A countdown ring at 24:17 of 30 minutes while the sun rises.</title>
  <style>
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sun { animation: rise 6s cubic-bezier(.2,.7,.2,1) both; }
    .glow { animation: dawn 6s ease-out both; }
    @keyframes rise { from { transform: translateY(44px); } to { transform: translateY(0); } }
    @keyframes dawn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sun, .glow { animation: none; } }
  </style>
  <defs>
    <radialGradient id="g" cx="930" cy="300" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2B35B" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#F2B35B" stop-opacity=".03"/>
      <stop offset="1" stop-color="#F2B35B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sky"><rect x="840" y="300" width="180" height="58"/></clipPath>
  </defs>

  <rect width="1280" height="540" rx="28" fill="#14120F"/>
  <rect class="glow" width="1280" height="540" rx="28" fill="url(#g)"/>

  <!-- countdown ring, as on the block screen: 24:17 left of 30 min -->
  <circle cx="930" cy="270" r="170" fill="none" stroke="#34302A" stroke-width="20"/>
  <circle cx="930" cy="270" r="170" fill="none" stroke="#F2B35B" stroke-width="20" stroke-linecap="round"
          stroke-dasharray="865 1068" transform="rotate(-90 930 270)"/>
  <text x="930" y="242" text-anchor="middle" class="sans" font-size="72" font-weight="300" fill="#ECE3D6"
        style="font-variant-numeric: tabular-nums">24:17</text>
  <text x="930" y="280" text-anchor="middle" class="sans" font-size="21" fill="#A39A8C">of 30 min</text>

  <!-- sun rising inside the ring, like the app icon -->
  <g clip-path="url(#sky)">
    <circle class="sun" cx="930" cy="358" r="40" fill="#F8D7A6"/>
  </g>
  <line x1="872" y1="358" x2="988" y2="358" stroke="#F8D7A6" stroke-width="4" stroke-linecap="round"/>

  <!-- copy -->
  <text x="88" y="168" class="sans" font-size="17" font-weight="600" letter-spacing="3" fill="#F2B35B">06:42 · PHONE BLOCKED</text>
  <text x="84" y="252" class="serif" font-size="66" fill="#ECE3D6">The first 30 minutes</text>
  <text x="84" y="330" class="serif" font-size="66" font-style="italic" fill="#F8D7A6">are yours.</text>
  <text x="88" y="392" class="sans" font-size="23" fill="#A39A8C">An Android app that keeps your phone shut</text>
  <text x="88" y="424" class="sans" font-size="23" fill="#A39A8C">while you wake up.</text>
</svg>
